[project]
name = "sentinelbank"
version = "0.1.0"
description = "Real-time fraud detection and an agentic banking assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "faker>=26.0",
    "confluent-kafka>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-groq>=0.2.1",
    "langchain-ollama>=0.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "httpx2>=0.28",
]
ml = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "mlflow>=2.16",
    "pyarrow>=17.0",
    "tabulate>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"ml/features/online.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests", "assistant/tests", "streaming/tests"]
pythonpath = ["."]