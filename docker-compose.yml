x-backend: &backend
  image: sentinelbank-backend
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDPANDA_BROKER: redpanda:9092
    API_BASE_URL: http://localhost:8000
    MODEL_PATH: /app/models/fraud_xgb.json
  volumes:
    - ./models:/app/models:ro
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: sentinelbank-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  topics:
    image: redpandadata/redpanda:v24.2.7
    container_name: sentinelbank-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic create transactions scores --partitions 3 --replicas 1
        -X brokers=redpanda:9092 || true
    restart: "no"

  api:
    <<: *backend
    container_name: sentinelbank-api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  consumer:
    <<: *backend
    container_name: sentinelbank-consumer
    command: ["python", "-m", "streaming.consumer.score"]
    ports:
      - "9100:9100"
    depends_on:
      api:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    

  producer:
    <<: *backend
    container_name: sentinelbank-producer
    command: ["python", "-m", "streaming.producer.produce", "--limit", "500", "--rate", "5", "--since", "2026-09-01"]
    depends_on:
      consumer:
        condition: service_started
    restart: "no"
    profiles: ["demo"]

  frontend:
    image: sentinelbank-frontend
    build: ./frontend
    container_name: sentinelbank-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sentinelbank-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - consumer

volumes:
  postgres_data:
  redpanda_data:
  prometheus_data: