name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: sentinelbank
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelbank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: sentinelbank
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5434"
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256-signing
      LLM_PROVIDER: groq
      GROQ_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Generate data and train model
        run: |
          uv run python -m data.generator.generate --reset --customers 60 --days 40
          uv run python -m ml.features.build
          uv run python -m ml.training.train

      - name: Test
        run: uv run pytest -q -m "not live"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sentinelbank-backend .

      - name: Build frontend image
        run: docker build -t sentinelbank-frontend ./frontend
